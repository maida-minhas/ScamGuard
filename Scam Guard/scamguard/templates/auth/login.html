{% extends "base.html" %}

{% block title %}Log in — ScamGuard{% endblock %}

{% block content %}
  <div class="mx-auto max-w-md rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-xl font-bold text-slate-900">Log in</h1>
    <form method="post" class="mt-4 space-y-4">
      <label class="block text-sm font-medium text-slate-700">
        Email
        <input type="email" name="email" required value="{{ email or '' }}"
               class="mt-1 w-full rounded border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none">
      </label>
      <label class="block text-sm font-medium text-slate-700">
        Password
        <input type="password" name="password" required
               class="mt-1 w-full rounded border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none">
      </label>
      <button type="submit"
              class="rounded bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">
        Log in
      </button>
    </form>
    <p class="mt-4 text-sm text-slate-600">
      No account yet?
      <a href="{{ url_for('auth.register') }}" class="text-indigo-600 hover:underline">Register</a>
    </p>
  </div>
{% endblock %}
