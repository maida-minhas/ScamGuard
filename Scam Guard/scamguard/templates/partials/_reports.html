<ul class="space-y-3">
  {% for report in reports %}
    <li class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
      <p class="text-sm font-medium text-slate-900">{{ report.category.value.replace('_', ' ')|title }}</p>
      <p class="mt-1 text-sm text-slate-600">{{ report.description }}</p>
      <p class="mt-2 text-xs text-slate-400">{{ report.created_at.strftime('%Y-%m-%d') }}</p>
    </li>
  {% endfor %}
</ul>
